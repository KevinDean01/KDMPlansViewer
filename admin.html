<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KDM Plans Access Manager</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #101218;
        color: #eef4ff;
      }
      body {
        display: grid;
        place-items: start center;
        padding: 18px;
      }
      .card {
        width: min(860px, 100%);
        background: #141a29;
        border: 1px solid #2c3550;
        border-radius: 10px;
        padding: 16px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 1.15rem;
      }
      .row {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .row label {
        color: #bed0ff;
        font-size: 0.9rem;
      }
      input,
      select,
      button,
      textarea {
        border: 1px solid #3b4e80;
        border-radius: 6px;
        background: #101727;
        color: #eef4ff;
        font-size: 0.9rem;
      }
      input,
      select,
      textarea {
        padding: 8px;
      }
      button {
        padding: 8px 10px;
        background: #223253;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      .status {
        margin: 8px 0 14px;
        color: #c3d0ff;
      }
      .hint {
        color: #9fb6ef;
        font-size: 0.82rem;
      }
      textarea {
        width: 100%;
        min-height: 84px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>KDM Plans Access Manager</h1>

      <div class="row">
        <label for="adminEmail">Admin email</label>
        <div>
          <input
            id="adminEmail"
            type="email"
            autocomplete="email"
            placeholder="you@kdmodels.co.uk"
          />
          <button id="adminLoginBtn" type="button">
            Send Admin Login Link
          </button>
          <button id="adminSignOutBtn" type="button" hidden>Sign Out</button>
          <div id="adminState" class="hint">Not signed in</div>
        </div>
      </div>

      <hr style="border-color: #2c3550; opacity: 0.45" />

      <div class="row">
        <label for="customerEmail">Customer email</label>
        <input
          id="customerEmail"
          type="email"
          autocomplete="email"
          placeholder="customer@email.com"
        />
      </div>

      <div class="row">
        <label for="planSelect">Plan</label>
        <div>
          <select id="planSelect"></select>
          <div class="actions">
            <button id="refreshPlansBtn" type="button" disabled>
              Refresh Plan List
            </button>
          </div>
          <div class="hint">
            Add each plan once to the <code>plans</code> table, then assign it to customers.
          </div>
        </div>
      </div>

      <div class="row">
        <label for="newPlanName">Add new plan</label>
        <div>
          <input
            id="newPlanName"
            type="text"
            placeholder="Plan display name (e.g. Shed Type A)"
          />
          <div class="actions">
            <input id="newPlanFile" type="file" accept=".glb,model/gltf-binary" />
            <button id="addPlanBtn" type="button" disabled>
              Upload + Add to Catalog
            </button>
          </div>
          <div class="hint">
            Uploads one shared catalog file to <code>Plans/catalog/</code> and adds it to the plan list.
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="provisionBtn" type="button" disabled>
          Assign Plan + Generate Customer Link
        </button>
      </div>

      <div id="status" class="status">Sign in as admin to begin.</div>

      <div class="row">
        <label for="magicLink">Customer magic link</label>
        <div>
          <textarea id="magicLink" readonly></textarea>
          <div class="actions">
            <button id="copyMagicBtn" type="button" disabled>
              Copy Magic Link
            </button>
            <button id="emailMagicBtn" type="button" disabled>
              Email Customer
            </button>
          </div>
        </div>
      </div>

      <div class="row">
        <label for="viewerLink">Viewer fallback link</label>
        <div>
          <textarea id="viewerLink" readonly></textarea>
          <div class="actions">
            <button id="copyViewerBtn" type="button" disabled>
              Copy Viewer Link
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (() => {
        const SUPABASE_URL = "https://pzcyhagbergybdtwyahs.supabase.co";
        const SUPABASE_ANON_KEY =
          "sb_publishable_D11hU21IX1oohA6nMjhoGA_bY7eZNlb";
        const EDGE_LIST_PLANS_FUNCTION = "list-catalog-plans";
        const EDGE_ASSIGN_FUNCTION = "assign-customer-plan";
        const EDGE_PREPARE_PLAN_UPLOAD_FUNCTION = "prepare-catalog-plan-upload";
        const EDGE_REGISTER_PLAN_FUNCTION = "register-catalog-plan";

        const adminEmailEl = document.getElementById("adminEmail");
        const adminLoginBtn = document.getElementById("adminLoginBtn");
        const adminSignOutBtn = document.getElementById("adminSignOutBtn");
        const adminStateEl = document.getElementById("adminState");
        const customerEmailEl = document.getElementById("customerEmail");
        const planSelectEl = document.getElementById("planSelect");
        const refreshPlansBtn = document.getElementById("refreshPlansBtn");
        const newPlanNameEl = document.getElementById("newPlanName");
        const newPlanFileEl = document.getElementById("newPlanFile");
        const addPlanBtn = document.getElementById("addPlanBtn");
        const provisionBtn = document.getElementById("provisionBtn");
        const statusEl = document.getElementById("status");
        const magicLinkEl = document.getElementById("magicLink");
        const viewerLinkEl = document.getElementById("viewerLink");
        const copyMagicBtn = document.getElementById("copyMagicBtn");
        const copyViewerBtn = document.getElementById("copyViewerBtn");
        const emailMagicBtn = document.getElementById("emailMagicBtn");

        let currentSessionUser = null;

        function setStatus(message) {
          statusEl.textContent = message;
        }

        function setResultLinks(magicLink, viewerLink, customerEmail) {
          magicLinkEl.value = magicLink || "";
          viewerLinkEl.value = viewerLink || "";
          copyMagicBtn.disabled = !magicLink;
          copyViewerBtn.disabled = !viewerLink;
          emailMagicBtn.disabled = !magicLink || !customerEmail;
        }

        function setSignedInUi(user) {
          currentSessionUser = user;
          const isSignedIn = Boolean(user);
          adminLoginBtn.hidden = isSignedIn;
          adminSignOutBtn.hidden = !isSignedIn;
          adminEmailEl.hidden = isSignedIn;
          adminStateEl.textContent = isSignedIn
            ? `Signed in: ${user.email || "Admin"}`
            : "Not signed in";
          refreshPlansBtn.disabled = !isSignedIn;
          addPlanBtn.disabled = !isSignedIn;
          provisionBtn.disabled = !isSignedIn || !planSelectEl.value;
        }

        function replacePlanOptions(plans) {
          planSelectEl.innerHTML = "";
          const defaultOption = document.createElement("option");
          defaultOption.value = "";
          defaultOption.textContent = plans.length
            ? "Select a plan..."
            : "No plans available";
          planSelectEl.appendChild(defaultOption);
          plans.forEach((plan) => {
            const option = document.createElement("option");
            option.value = plan.id;
            option.textContent = `${plan.name} (${plan.storage_path})`;
            option.title = plan.storage_path;
            planSelectEl.appendChild(option);
          });
          provisionBtn.disabled =
            !currentSessionUser || !planSelectEl.value || plans.length === 0;
        }

        async function copyText(value) {
          await navigator.clipboard.writeText(value);
        }

        if (
          !window.supabase ||
          typeof window.supabase.createClient !== "function" ||
          !SUPABASE_URL ||
          !SUPABASE_ANON_KEY ||
          SUPABASE_ANON_KEY === "REPLACE_WITH_SUPABASE_ANON_KEY"
        ) {
          setStatus(
            "Set SUPABASE_ANON_KEY in admin.html before using this tool.",
          );
          return;
        }

        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
        );

        async function loadPlansForAdmin() {
          if (!currentSessionUser) {
            replacePlanOptions([]);
            return;
          }
          setStatus("Loading plans...");
          const { data, error } = await supabase.functions.invoke(
            EDGE_LIST_PLANS_FUNCTION,
            {
              body: {},
            },
          );
          if (error) {
            setStatus(`Failed to load plans: ${error.message}`);
            return;
          }
          const plans = Array.isArray(data && data.plans) ? data.plans : [];
          replacePlanOptions(plans);
          if (plans.length === 0) {
            setStatus(
              "No plans in catalog. Add rows to public.plans in Supabase first.",
            );
            return;
          }
          setStatus("Ready to assign plan access.");
        }

        supabase.auth.onAuthStateChange(async (_event, session) => {
          setSignedInUi(session && session.user ? session.user : null);
          if (session && session.user) {
            await loadPlansForAdmin();
          } else {
            replacePlanOptions([]);
            setStatus("Sign in as admin to begin.");
          }
        });

        supabase.auth.getSession().then(async ({ data, error }) => {
          if (error) {
            setStatus(`Session check failed: ${error.message}`);
            return;
          }
          setSignedInUi(data && data.session ? data.session.user : null);
          if (data && data.session && data.session.user) {
            await loadPlansForAdmin();
          } else {
            replacePlanOptions([]);
          }
        });

        adminLoginBtn.addEventListener("click", async () => {
          const email = String(adminEmailEl.value || "").trim();
          if (!email) {
            setStatus("Enter your admin email address first.");
            return;
          }
          const redirectTo = `${window.location.origin}${window.location.pathname}`;
          const { error } = await supabase.auth.signInWithOtp({
            email,
            options: { emailRedirectTo: redirectTo },
          });
          if (error) {
            setStatus(`Admin login failed: ${error.message}`);
            return;
          }
          setStatus(`Admin login link sent to ${email}.`);
        });

        adminSignOutBtn.addEventListener("click", async () => {
          const { error } = await supabase.auth.signOut();
          if (error) {
            setStatus(`Sign out failed: ${error.message}`);
            return;
          }
          setResultLinks("", "", "");
          replacePlanOptions([]);
          setStatus("Signed out.");
        });

        refreshPlansBtn.addEventListener("click", async () => {
          await loadPlansForAdmin();
        });

        planSelectEl.addEventListener("change", () => {
          provisionBtn.disabled = !currentSessionUser || !planSelectEl.value;
        });

        addPlanBtn.addEventListener("click", async () => {
          const planName = String(newPlanNameEl.value || "").trim();
          const file = newPlanFileEl.files && newPlanFileEl.files[0];
          if (!planName) {
            setStatus("Enter a plan name first.");
            return;
          }
          if (!file) {
            setStatus("Choose a .glb file for the new plan.");
            return;
          }
          if (!currentSessionUser) {
            setStatus("Sign in as admin first.");
            return;
          }
          addPlanBtn.disabled = true;
          refreshPlansBtn.disabled = true;
          provisionBtn.disabled = true;
          try {
            setStatus("Preparing catalog upload...");
            const { data: prepData, error: prepError } =
              await supabase.functions.invoke(EDGE_PREPARE_PLAN_UPLOAD_FUNCTION, {
                body: {
                  planName,
                  fileName: file.name,
                },
              });
            if (prepError) throw prepError;
            if (
              !prepData ||
              !prepData.storagePath ||
              !prepData.uploadToken ||
              !prepData.planName
            ) {
              throw new Error("Plan upload preparation returned invalid response.");
            }

            setStatus("Uploading plan file to catalog...");
            const { error: uploadError } = await supabase.storage
              .from("Plans")
              .uploadToSignedUrl(prepData.storagePath, prepData.uploadToken, file);
            if (uploadError) throw uploadError;

            setStatus("Registering plan...");
            const { data: registerData, error: registerError } =
              await supabase.functions.invoke(EDGE_REGISTER_PLAN_FUNCTION, {
                body: {
                  name: prepData.planName,
                  storagePath: prepData.storagePath,
                },
              });
            if (registerError) throw registerError;
            if (!registerData || !registerData.planId) {
              throw new Error("Plan register returned invalid response.");
            }

            newPlanNameEl.value = "";
            newPlanFileEl.value = "";
            await loadPlansForAdmin();
            setStatus(`Plan added: ${registerData.name}`);
          } catch (error) {
            const message =
              error && error.message ? error.message : "Unknown add-plan error";
            setStatus(`Failed to add plan: ${message}`);
            console.error("Add plan failure:", error);
          } finally {
            refreshPlansBtn.disabled = !currentSessionUser;
            addPlanBtn.disabled = !currentSessionUser;
            provisionBtn.disabled = !currentSessionUser || !planSelectEl.value;
          }
        });

        provisionBtn.addEventListener("click", async () => {
          const customerEmail = String(customerEmailEl.value || "").trim();
          const planId = String(planSelectEl.value || "").trim();
          if (!customerEmail) {
            setStatus("Enter a customer email.");
            return;
          }
          if (!planId) {
            setStatus("Choose a plan first.");
            return;
          }
          provisionBtn.disabled = true;
          setResultLinks("", "", "");
          try {
            setStatus("Assigning plan access and generating magic link...");
            const { data, error } = await supabase.functions.invoke(
              EDGE_ASSIGN_FUNCTION,
              {
                body: {
                  customerEmail,
                  planId,
                },
              },
            );
            if (error) throw error;
            if (!data || !data.magicLink || !data.viewerLink) {
              throw new Error("Assign function returned invalid response.");
            }
            setResultLinks(data.magicLink, data.viewerLink, customerEmail);
            setStatus("Done. Copy magic link or open email draft.");
          } catch (error) {
            const message =
              error && error.message ? error.message : "Unknown assign error";
            setStatus(`Failed: ${message}`);
            console.error("Assign failure:", error);
          } finally {
            provisionBtn.disabled = !currentSessionUser || !planSelectEl.value;
          }
        });

        copyMagicBtn.addEventListener("click", async () => {
          try {
            await copyText(magicLinkEl.value);
            setStatus("Magic link copied.");
          } catch (_error) {
            setStatus("Copy failed for magic link.");
          }
        });

        copyViewerBtn.addEventListener("click", async () => {
          try {
            await copyText(viewerLinkEl.value);
            setStatus("Viewer link copied.");
          } catch (_error) {
            setStatus("Copy failed for viewer link.");
          }
        });

        emailMagicBtn.addEventListener("click", () => {
          const customerEmail = String(customerEmailEl.value || "").trim();
          const magicLink = magicLinkEl.value;
          const viewerLink = viewerLinkEl.value;
          if (!customerEmail || !magicLink) return;
          const subject = encodeURIComponent("Your 3D plan viewer access");
          const body = encodeURIComponent(
            [
              "Hi,",
              "",
              "Use this secure login link to open your 3D plan:",
              magicLink,
              "",
              "Fallback viewer link:",
              viewerLink,
              "",
              "If prompted, sign in with this same email address.",
            ].join("\n"),
          );
          window.location.href = `mailto:${encodeURIComponent(customerEmail)}?subject=${subject}&body=${body}`;
        });
      })();
    </script>
  </body>
</html>
