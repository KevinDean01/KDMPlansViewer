<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KDM Garden Plans Viewer</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --color-page-bg: #0b0d10;
        --color-page-text: #f3f4f6;
        --color-toolbar-bg: rgba(20, 23, 29, 0.72);
        --color-toolbar-border: rgba(255, 255, 255, 0.08);
        --color-primary-button-bg: #3b82f6;
        --color-button-text: #ffffff;
        --color-control-border: rgba(255, 255, 255, 0.08);
        --color-control-bg: rgba(255, 255, 255, 0.06);
        --color-control-text: #f3f4f6;
        --color-control-active-border: rgba(59, 130, 246, 0.5);
        --color-control-active-bg: rgba(59, 130, 246, 0.18);
        --color-control-active-text: #ffffff;
        --color-status-text: #9ca3af;
        --color-label-text: #9ca3af;
        --color-range-thumb-border: #3b82f6;
        --color-range-thumb-bg: #f3f4f6;
        --color-slider-value-text: #9ca3af;
        --color-step-label-text: #9ca3af;
        --color-nav-button-border: rgba(255, 255, 255, 0.08);
        --color-nav-button-bg: rgba(20, 23, 29, 0.85);
        --color-nav-button-hover-bg: #20252e;
        --color-nav-button-active-bg: #2563eb;
        --color-nav-button-shadow-ring: transparent;
        --color-nav-button-shadow-drop: #00000059;
        --color-overlay-line: #f3dfa0;
        --color-viewer-label-border: rgba(255, 255, 255, 0.16);
        --color-viewer-label-bg: #14171deb;
        --color-viewer-label-text: #f3f4f6;
        --color-parts-panel-bg: rgba(20, 23, 29, 0.72);
        --color-scrollbar-thumb: #42464d;
        --color-scrollbar-track: transparent;
        --color-part-item-border: transparent;
        --color-part-item-bg: transparent;
        --color-part-item-hover-border: rgba(255, 255, 255, 0.16);
        --color-part-item-active-bg: rgba(59, 130, 246, 0.18);
        --color-part-item-active-border: rgba(59, 130, 246, 0.35);
        --color-step-current-border: #9ca3af;
        --color-scene-background: #0b0d10;
        --color-light-ambient: #ffffff;
        --color-light-key: #ffffff;
        --color-light-fill: #9bb7ff;
        --color-grid-major: #3b82f6;
        --color-grid-minor: #1f2530;
        --color-highlight-fixing-selected: #ff4a4a;
        --color-highlight-fixing: #e03535;
        --color-highlight-subphase: #5d4e0c;
        --color-highlight-selected: #3ef722;
        --color-highlight-default: #060606;
        --btnbordrad: 10px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: var(--color-page-bg);
        color: var(--color-page-text);
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        padding: 10px 14px;
        background: var(--color-toolbar-bg);
        border-bottom: 1px solid var(--color-toolbar-border);
      }
      .toolbar h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      .file-button {
        padding: 8px 10px;
        border-radius: var(--btnbordrad);
        background: var(--color-primary-button-bg);
        color: var(--color-button-text);
        cursor: pointer;
        font-size: 0.9rem;
      }
      .toolbar-button {
        padding: 6px 10px;
        border: 1px solid var(--color-control-border);
        border-radius: var(--btnbordrad);
        background: var(--color-control-bg);
        color: var(--color-control-text);
        font-size: 0.82rem;
        cursor: pointer;
      }
      .toolbar-button.active {
        border-color: var(--color-control-active-border);
        background: var(--color-control-active-bg);
        color: var(--color-control-active-text);
      }
      #modelInput {
        display: none;
      }
      #status {
        margin-left: auto;
        font-size: 0.85rem;
        color: var(--color-status-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .settings-panel {
        display: none;
      }
      .settings-panel.open {
        display: flex;
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--color-label-text);
      }
      .controls input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 110px;
        height: 18px;
        background: transparent;
      }
      .controls input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border: 1px solid var(--color-control-border);
        border-radius: var(--btnbordrad);
        background: var(--color-control-bg);
      }
      .controls input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5px;
        border: 1px solid var(--color-range-thumb-border);
        border-radius: var(--btnbordrad);
        background: var(--color-range-thumb-bg);
      }
      .controls input[type="range"]::-moz-range-track {
        height: 6px;
        border: 1px solid var(--color-control-border);
        border-radius: var(--btnbordrad);
        background: var(--color-control-bg);
      }
      .controls input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 1px solid var(--color-range-thumb-border);
        border-radius: var(--btnbordrad);
        background: var(--color-range-thumb-bg);
      }
      .controls span {
        width: 28px;
        text-align: right;
        color: var(--color-slider-value-text);
      }
      .build-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .build-stage-buttons {
        display: inline-flex;
        gap: 4px;
      }
      .build-controls button {
        padding: 5px 8px;
        border: 1px solid var(--color-control-border);
        border-radius: var(--btnbordrad);
        background: var(--color-control-bg);
        color: var(--color-control-text);
        font-size: 0.78rem;
        cursor: pointer;
      }
      .build-controls button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .build-controls button.active {
        border-color: var(--color-control-active-border);
        background: var(--color-control-active-bg);
        color: var(--color-control-active-text);
      }
      #buildStepLabel {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 25;
        max-width: min(70%, 460px);
        padding: 6px 10px;
        border: 1px solid var(--color-viewer-label-border);
        border-radius: var(--btnbordrad);
        background: var(--color-viewer-label-bg);
        pointer-events: none;
        font-size: 0.78rem;
        color: var(--color-viewer-label-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
      }
      #viewer {
        grid-column: 2;
        grid-row: 1;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }
      #viewerSplit {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }
      #viewerSplit.pdf-open {
        grid-template-columns: minmax(0, 1fr) minmax(280px, 40%);
      }
      #renderPanel {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }
      #pdfPanel {
        display: none;
        border-left: 1px solid var(--color-toolbar-border);
        background: #ffffff;
      }
      #viewerSplit.pdf-open #pdfPanel {
        display: block;
      }
      #pdfFrame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #ffffff;
      }
      #pdfMobileViewer {
        display: none;
        height: 100%;
        min-height: 0;
        grid-template-rows: auto minmax(0, 1fr);
        color: #0f172a;
        background: #ffffff;
      }
      #pdfMobileViewer[aria-hidden="false"] {
        display: grid;
      }
      #pdfMobileToolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid #d0d7e7;
      }
      #pdfMobileToolbar button {
        border: 1px solid #3b4e80;
        border-radius: var(--btnbordrad);
        background: #223253;
        color: #dbe4ff;
        font-size: 0.78rem;
        padding: 6px 10px;
        cursor: pointer;
      }
      #pdfMobileToolbar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #pdfMobilePageLabel {
        margin-left: auto;
        font-size: 0.82rem;
        color: #1f2a44;
      }
      #pdfMobileCanvasWrap {
        min-height: 0;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        padding: 10px;
        background: #f8fafc;
      }
      #pdfMobileCanvas {
        display: block;
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        background: #ffffff;
        box-shadow: 0 2px 8px #0f172a26;
      }
      #pdfMobileHint {
        margin: 8px 10px 10px;
        font-size: 0.92rem;
        line-height: 1.3;
        color: #334155;
      }
      #openPdfButton.hidden {
        display: none;
      }
      #pdfInput {
        display: none;
      }
      #viewer {
        position: relative;
      }
      .viewer-nav-button {
        position: absolute;
        top: 10px;
        z-index: 20;
        padding: 6px 10px;
        border: 1px solid var(--color-nav-button-border);
        border-radius: var(--btnbordrad);
        background: var(--color-nav-button-bg);
        color: var(--color-button-text);
        font-weight: 600;
        font-size: 0.78rem;
        cursor: pointer;
        box-shadow:
          0 0 0 1px var(--color-nav-button-shadow-ring),
          0 8px 18px var(--color-nav-button-shadow-drop);
      }
      .viewer-nav-button:hover:not(:disabled) {
        background: var(--color-nav-button-hover-bg);
      }
      .viewer-nav-button:active:not(:disabled) {
        background: var(--color-nav-button-active-bg);
      }
      .viewer-nav-button.left {
        left: 10px;
      }
      .viewer-nav-button.right {
        right: 10px;
      }
      .viewer-nav-button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .viewer-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .viewer-overlay svg {
        width: 100%;
        height: 100%;
      }
      .viewer-overlay line {
        stroke: var(--color-overlay-line);
        stroke-width: 1.5;
      }
      .viewer-label {
        position: absolute;
        max-width: 260px;
        padding: 6px 8px;
        border: 1px solid var(--color-viewer-label-border);
        border-radius: var(--btnbordrad);
        background: var(--color-viewer-label-bg);
        color: var(--color-viewer-label-text);
        font-size: 0.76rem;
        line-height: 1.3;
        white-space: normal;
        word-break: break-word;
      }
      #partsPanel {
        grid-column: 1;
        grid-row: 1;
        border-right: 1px solid var(--color-toolbar-border);
        background: var(--color-parts-panel-bg);
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px;
        scrollbar-color: var(--color-scrollbar-thumb)
          var(--color-scrollbar-track);
        scrollbar-width: thin;
      }
      #partsPanel::-webkit-scrollbar {
        width: 10px;
      }
      #partsPanel::-webkit-scrollbar-track {
        background: var(--color-scrollbar-track);
      }
      #partsPanel::-webkit-scrollbar-thumb {
        background: var(--color-scrollbar-thumb);
        border-radius: var(--btnbordrad);
        border: 2px solid var(--color-scrollbar-track);
      }
      #partsPanel h2 {
        margin: 0 0 8px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--color-label-text);
        overflow-wrap: anywhere;
      }
      #partsList {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #partsList li {
        padding: 7px 8px;
        border: 1px solid var(--color-part-item-border);
        border-radius: var(--btnbordrad);
        font-size: 0.82rem;
        color: var(--color-control-text);
        background: var(--color-part-item-bg);
        cursor: pointer;
        user-select: none;
        word-break: break-word;
      }
      #partsList .part-name {
        font-weight: 600;
        line-height: 1.25;
      }
      #partsList .part-size {
        margin-top: 3px;
        font-size: 0.74rem;
        color: var(--color-step-label-text);
        line-height: 1.2;
      }
      #partsList .part-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #partsList .part-text {
        flex: 1;
        min-width: 0;
      }
      .part-visibility {
        display: grid;
        place-items: center;
        flex: none;
        width: 30px;
        height: 30px;
        padding: 5px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: #9ca3af;
        cursor: pointer;
      }
      .part-visibility:hover {
        border-color: var(--color-control-border);
        background: rgba(255, 255, 255, 0.12);
        color: #f3f4f6;
      }
      .part-visibility svg {
        width: 18px;
        height: 18px;
      }
      .part-visibility[data-visible="true"] .eye-slash {
        display: none;
      }
      .part-visibility[data-visible="false"] {
        color: #6b7280;
      }
      #partsList li:hover {
        border-color: var(--color-part-item-hover-border);
      }
      #partsList li.active {
        background: var(--color-part-item-active-bg);
        border-color: var(--color-part-item-active-border);
        color: var(--color-button-text);
      }
      #partsList li.step-hidden {
        opacity: 0.45;
      }
      #partsList.build-it-filter li.step-hidden {
        display: none;
      }
      #partsList.build-it-filter li.step-list-hidden {
        display: none;
      }
      #partsList li.step-current {
        border-color: var(--color-step-current-border);
        box-shadow: inset 0 0 0 1px var(--color-step-current-border);
      }

      body {
        padding: 12px;
        gap: 12px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }
      .toolbar,
      #partsPanel,
      .build-controls {
        background: var(--color-toolbar-bg);
        border: 1px solid var(--color-toolbar-border);
        border-radius: 14px;
        box-shadow: 0 12px 32px -4px #0000008c, 0 4px 12px -2px #00000059;
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
      }
      .toolbar {
        position: relative;
        z-index: 30;
        padding: 10px 14px;
        gap: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-right: 6px;
      }
      .brand-icon {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        box-shadow: 0 0 14px #3b82f659;
        font-size: 11px;
        font-weight: 700;
      }
      .toolbar h1 {
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      .file-button,
      .toolbar-button,
      .build-controls button,
      .viewer-nav-button {
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        border-radius: 6px;
        transition: background 140ms, border-color 140ms;
      }
      .file-button {
        padding: 7px 12px;
        box-shadow: 0 4px 14px #3b82f659;
      }
      .file-button:hover {
        background: #2563eb;
      }
      .toolbar-button:hover,
      .build-controls button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.16);
      }
      button:focus-visible,
      .file-button:focus-within,
      input:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
      #status {
        min-width: 0;
        font-family: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
        font-size: 11px;
      }
      .settings-panel.open {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        flex-direction: column;
        align-items: stretch;
        width: min(340px, 100%);
        max-height: 50dvh;
        overflow-y: auto;
        padding: 8px 10px;
        border: 1px solid var(--color-toolbar-border);
        border-radius: 10px;
        background: #14171df2;
        box-shadow: 0 12px 32px -4px #0000008c;
      }
      .settings-panel label {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(70px, 110px) 28px;
      }
      .settings-panel input[type="range"] {
        width: 100%;
      }
      .controls input[type="range"]::-webkit-slider-thumb {
        border-width: 2px;
        border-radius: 50%;
      }
      .controls input[type="range"]::-moz-range-thumb {
        border-width: 2px;
        border-radius: 50%;
      }
      main {
        gap: 12px;
        grid-template-columns: 270px minmax(0, 1fr);
      }
      #partsPanel {
        padding: 0 10px 10px;
        border-right: 1px solid var(--color-toolbar-border);
      }
      #partsPanel h2 {
        margin: 0 -10px 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--color-toolbar-border);
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #partsList {
        gap: 3px;
      }
      #partsList li {
        border-radius: 6px;
        color: #9ca3af;
      }
      #partsList li:hover {
        background: rgba(32, 37, 46, 0.85);
        color: #f3f4f6;
      }
      #viewer,
      #renderPanel {
        overflow: hidden;
        border-radius: 14px;
      }
      #renderPanel canvas {
        display: block;
      }
      #viewerSplit.pdf-open {
        gap: 12px;
      }
      #pdfPanel {
        overflow: hidden;
        border: 1px solid var(--color-toolbar-border);
        border-radius: 14px;
      }
      #buildStepLabel,
      .viewer-label {
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
      }
      .viewer-nav-button {
        box-shadow: 0 4px 12px #00000059;
      }
      .bottom-bar {
        display: flex;
        justify-content: center;
        min-width: 0;
      }
      .build-controls {
        justify-content: center;
        flex-wrap: wrap;
        padding: 6px 10px;
      }
      .build-stage-buttons {
        flex-wrap: wrap;
        padding: 3px;
        border: 1px solid var(--color-toolbar-border);
        border-radius: 10px;
        background: rgba(11, 13, 16, 0.65);
      }
      .build-stage-buttons button {
        border-color: transparent;
        background: transparent;
        color: #9ca3af;
      }
      @media (max-width: 700px) {
        body {
          padding: 8px;
          gap: 8px;
        }
        .toolbar {
          gap: 8px;
        }
        #status {
          flex-basis: 100%;
        }
        main {
          gap: 8px;
          grid-template-columns: minmax(110px, 30%) minmax(0, 1fr);
        }
        #viewerSplit.pdf-open {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
          gap: 8px;
        }
        #buildStepLabel {
          top: 46px;
          max-width: calc(100% - 20px);
        }
        .viewer-nav-button {
          width: calc(50% - 15px);
          padding: 6px 2px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .build-controls {
          gap: 4px;
          padding: 5px;
        }
        .build-controls button {
          padding: 5px 6px;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">3D</span>
        <h1>KDM Garden Plans Viewer</h1>
      </div>
      <label id="openProjectButton" class="file-button" for="modelInput"
        >Open KDM Model</label
      >
      <input id="modelInput" type="file" accept="*/*" />
      <label id="openPdfButton" class="file-button" for="pdfInput"
        >Open PDF Plans</label
      >
      <input id="pdfInput" type="file" accept="application/pdf,.pdf" />
      <button id="settingsToggle" class="toolbar-button" type="button" aria-controls="settingsPanel" aria-expanded="false">
        Settings
      </button>
      <div id="settingsPanel" class="controls settings-panel">
        <label
          >Light
          <input
            id="lightIntensity"
            type="range"
            min="0.2"
            max="3"
            step="0.1"
            value="3"
          />
          <span id="lightIntensityValue">3</span>
        </label>
        <label
          >Shadow Darkness
          <input
            id="shadowOpacity"
            type="range"
            min="0"
            max="0.8"
            step="0.05"
            value="0.3"
          />
          <span id="shadowOpacityValue">0.30</span>
        </label>
        <label
          >Shadow Softness
          <input
            id="shadowSoftness"
            type="range"
            min="1"
            max="12"
            step="1"
            value="3"
          />
          <span id="shadowSoftnessValue">3</span>
        </label>
      </div>
      <span id="status" role="status">Ready: Open a kdm model file</span>
    </header>

    <main>
      <div id="viewer">
